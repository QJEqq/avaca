name: build

# What this exists to catch: the app cannot compile without avacacore.aar, and that file is not in
# the repository — so without this workflow nothing checks a change at all. Not the tests, not the
# Kotlin, not whether the generated Xray configuration is one the core accepts.
#
# The core is the expensive part (several minutes and a couple of gigabytes of Go modules), so it
# is cached against exactly what it is built from: the binding modules and the OpenFlux commit.
# A run that changes only app code restores it and takes about as long as a local build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_JAVA: '21'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Core cache key
        id: core-key
        run: |
          set -euo pipefail
          openflux="$(git -C third_party/OpenFlux rev-parse HEAD)"
          echo "key=avacacore-${{ hashFiles('core/go.sum', 'core/mobilecore.go', 'core-xray/go.sum', 'core-xray/yumi.go', 'tools/build-core.sh') }}-of${openflux}-ndk${NDK_VERSION}" >> "$GITHUB_OUTPUT"

      # restore/save rather than the combined action: the combined one only writes the cache when
      # the whole job succeeds, so a failure anywhere after this would throw the core build away.
      - name: Restore avacacore.aar
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: shared/libs/avacacore.aar
          key: ${{ steps.core-key.outputs.key }}

      # Unconditional: the configuration check below builds the Xray CLI whether or not the core
      # came out of the cache. The version comes from the binding's own go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            core-xray/go.sum

      # GOTOOLCHAIN=auto only ever upgrades, so a go.mod asking for less than what the runner ships
      # is considered satisfied and ignored. `local` forbids Go from switching behind the version
      # selected above.
      - name: Pin the toolchain the core demands
        run: |
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go version

      - name: Build avacacore.aar
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The x/mobile revision core/go.mod pins, not @latest: gomobile and the bind glue it
          # generates have to agree.
          (cd core && go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-24" "ndk;${NDK_VERSION}" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}" tools/build-core.sh both

      # Immediately, while the thing exists. Everything after this is cheap by comparison.
      - name: Save avacacore.aar
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: shared/libs/avacacore.aar
          key: ${{ steps.core-key.outputs.key }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.APP_JAVA }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      - name: Check the generated configurations against the real core
        run: |
          set -euo pipefail
          # A document that parses in Kotlin can still be refused by Xray, and only Xray is
          # authoritative about its own schema. The CLI runs on Linux, where the core takes other
          # platform paths than on Android: a pass here means the schema is right, not that the
          # tunnel will come up.
          #
          # Built out of the module graph the binding pins, so the CLI validating these documents
          # and the core reading them on a phone are the same revision.
          version="$(cd core-xray && go list -m -f '{{.Version}}' github.com/xtls/xray-core)"
          echo "validating against xray-core $version"
          (cd core-xray && CGO_ENABLED=0 go build -o /tmp/xray github.com/xtls/xray-core/main)

          # The geo databases: routing rules reference them and Xray resolves those while parsing.
          mkdir -p /tmp/xray-assets
          curl -sSL -o /tmp/xray-assets/geoip.dat \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -sSL -o /tmp/xray-assets/geosite.dat \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          export XRAY_LOCATION_ASSET=/tmp/xray-assets

          # Regenerated rather than assumed: the dump tests write these files as a side effect
          # Gradle does not track, so an up-to-date test run would leave stale or no documents.
          rm -rf shared/build/xray-configs shared/build/xray-matrix
          ./gradlew :shared:testDebugUnitTest \
            --tests '*XrayConfigDumpTest*' --tests '*XrayMatrixDumpTest*' --rerun

          shopt -s nullglob
          configs=(shared/build/xray-configs/*.json shared/build/xray-matrix/*.json)
          # Without a floor this step passes loudest when it checks nothing at all.
          if [ ${#configs[@]} -lt 100 ]; then
            echo "only ${#configs[@]} documents were written — the check would pass by being empty"
            exit 1
          fi
          echo "checking ${#configs[@]} documents"
          for config in "${configs[@]}"; do
            if ! /tmp/xray run -test -c "$config" > /tmp/xray-check.log 2>&1; then
              echo "REFUSED $(basename "$config")"
              tail -5 /tmp/xray-check.log
              exit 1
            fi
          done
          echo "the core accepted all ${#configs[@]}"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: avaca-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
